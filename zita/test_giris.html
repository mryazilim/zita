<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zita - Giriş Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2 style="text-align: center; margin-bottom: 30px;">Zita Giriş Test</h2>
        
        <form id="testForm">
            <div class="form-group">
                <label for="username">Kullanıcı Adı:</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>
            
            <div class="form-group">
                <label for="password">Şifre:</label>
                <input type="password" id="password" name="password" placeholder="admin123" required>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="remember" name="remember"> Beni hatırla
                </label>
            </div>
            
            <button type="submit">Giriş Yap</button>
        </form>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const messageDiv = document.getElementById('message');
            
            // Loading göster
            const button = document.querySelector('button');
            const originalText = button.textContent;
            button.textContent = 'Giriş yapılıyor...';
            button.disabled = true;
            
            try {
                const response = await fetch('api/giris.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        kullanici_adi: username,
                        sifre: password,
                        beni_hatirla: remember
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Giriş başarılı! Yönlendiriliyorsunuz...';
                    messageDiv.style.display = 'block';
                    
                    // Token kaydet
                    if (result.data.token) {
                        if (remember) {
                            localStorage.setItem('zita_token', result.data.token);
                            localStorage.setItem('zita_remember', 'true');
                        } else {
                            sessionStorage.setItem('zita_token', result.data.token);
                        }
                    }
                    
                    // Yönlendir
                    setTimeout(() => {
                        window.location.href = result.data.redirect || 'panel/dashboard/';
                    }, 2000);
                } else {
                    throw new Error(result.message || 'Giriş başarısız');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Hata: ' + error.message;
                messageDiv.style.display = 'block';
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
